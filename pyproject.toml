[project]
name = "docqueue"
version = "0.1.0"
description = "Async file-processing API: Django REST + API-key auth + a database-backed job queue"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "pillow>=13.0.0",
    "pypdf>=7.0.0",
]


[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["jobs/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
